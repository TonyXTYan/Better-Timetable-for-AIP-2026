name: Deploy timetable to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the page from src/ with build_program.py
        run: python3 build_program.py
      - name: Stage static site
        run: |
          mkdir site
          cp index.html aip-2026-program.html aip2026-data.json site/
          cp sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png site/
          cp -R shots site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
